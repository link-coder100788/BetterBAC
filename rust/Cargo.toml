[package]
name = "betterbac_core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
flutter_rust_bridge = { version = "=2.13.0", features = ["chrono"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v7"] }

# Native only: on-device Whisper dictation (candle). Not in the web build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"

# Web (wasm32) only: browser clock/randomness for UUIDs, and database
# snapshots so the in-browser database can be saved to browser storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.28.0", features = ["v7", "js"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "serialize"] }

[dev-dependencies]
# Lets the web snapshot code be unit-tested natively.
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "serialize"] }

# Dictation runs Whisper through candle, which is unusably slow unoptimized.
# Optimize all dependencies even in debug builds (`flutter run`); our own
# crate stays debuggable.
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
